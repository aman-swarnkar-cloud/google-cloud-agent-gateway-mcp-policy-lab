
name: MCP Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Check Python syntax
        run: |
          python -m compileall -q agent mcp-server

      - name: Validate Agent Registry MCP tool specification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("mcp-server/toolspec.json")
          spec = json.loads(path.read_text())

          tools = spec.get("tools")

          assert isinstance(tools, list) and tools, (
              "toolspec.json must contain a non-empty tools array"
          )

          by_name = {
              tool.get("name"): tool
              for tool in tools
          }

          expected_names = {
              "read_customer_profile",
              "update_customer_profile",
          }

          assert set(by_name) == expected_names, (
              f"Unexpected tool set: {set(by_name)}"
          )

          for name, tool in by_name.items():
              schema = tool.get("inputSchema")

              assert isinstance(schema, dict), (
                  f"{name}: inputSchema is required"
              )

              assert schema.get("type") == "object", (
                  f"{name}: inputSchema.type must be object"
              )

              properties = schema.get("properties")
              required = schema.get("required")

              assert isinstance(properties, dict), (
                  f"{name}: inputSchema.properties is required"
              )

              assert isinstance(required, list), (
                  f"{name}: inputSchema.required must be a list"
              )

              assert "customer_id" in properties, (
                  f"{name}: customer_id property is required"
              )

              assert (
                  properties["customer_id"].get("type") == "string"
              ), f"{name}: customer_id must be a string"

              assert "customer_id" in required, (
                  f"{name}: customer_id must be required"
              )

          update_schema = by_name[
              "update_customer_profile"
          ]["inputSchema"]

          assert "email" in update_schema["properties"], (
              "update_customer_profile: email property is required"
          )

          assert (
              update_schema["properties"]["email"].get("type")
              == "string"
          ), "update_customer_profile: email must be a string"

          assert "email" not in update_schema["required"], (
              "update_customer_profile: email must remain optional"
          )

          print(
              "PASS: Agent Registry MCP tool specification is valid"
          )
          PY

      - name: Test real MCP HTTP transport
        run: |
          python mcp-server/server.py > /tmp/mcp-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          python - <<'PY'
          import asyncio
          import json
          import socket
          from pathlib import Path
          
          from mcp import Client

          async def main():
              for _ in range(30):
                  try:
                      with socket.create_connection(
                          ("127.0.0.1", 8080), timeout=1
                      ):
                          break
                  except OSError:
                      await asyncio.sleep(1)
              else:
                  raise RuntimeError("MCP server did not start")

              async with Client("http://127.0.0.1:8080/mcp") as client:
                  tools = await client.list_tools()
                  runtime_names = {tool.name for tool in tools.tools}
                  
                  toolspec = json.loads(
                      Path("mcp-server/toolspec.json").read_text()
                  )
                  registry_names = {
                      tool["name"]
                      for tool in toolspec["tools"]
                  }
                  
                  assert runtime_names == {
                      "read_customer_profile",
                      "update_customer_profile",
                  }
                  
                  assert runtime_names == registry_names, (
                      "MCP server tools and Agent Registry toolspec.json "
                      f"are out of sync: runtime={runtime_names}, "
                      f"registry={registry_names}"
                  )

                  read = await client.call_tool(
                      "read_customer_profile",
                      {"customer_id": "CUST-1001"},
                  )
                  assert not read.is_error
                  assert read.structured_content["status"] == "success"

                  missing = await client.call_tool(
                      "read_customer_profile",
                      {"customer_id": "UNKNOWN"},
                  )
                  assert not missing.is_error
                  assert missing.structured_content["status"] == "not_found"

                  update = await client.call_tool(
                      "update_customer_profile",
                      {
                          "customer_id": "CUST-1001",
                          "email": "updated@example.com",
                      },
                  )
                  assert not update.is_error
                  assert (
                      update.structured_content["status"]
                      == "simulated_update"
                  )

                  after = await client.call_tool(
                      "read_customer_profile",
                      {"customer_id": "CUST-1001"},
                  )
                  assert (
                      after.structured_content["profile"]["email"]
                      == "sample@example.com"
                  )

              print("PASS: MCP HTTP integration tests")

          asyncio.run(main())
          PY
      - name: Build and test MCP Docker container
        run: |
          docker build \
            -f mcp-server/Dockerfile \
            -t mcp-policy-lab:test \
            mcp-server

          docker run -d \
            --name mcp-container-test \
            -p 127.0.0.1:18080:8080 \
            mcp-policy-lab:test

          trap 'docker logs mcp-container-test; docker rm -f mcp-container-test >/dev/null' EXIT
          # Wait until the MCP application has actually started.
          for attempt in $(seq 1 30); do
            if docker logs mcp-container-test 2>&1 | grep -q "Application startup complete."; then
              echo "MCP container is ready."
              break
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' mcp-container-test)" != "true" ]; then
              echo "MCP container exited unexpectedly."
              docker logs mcp-container-test
              exit 1
            fi

            sleep 1
          done

          # Fail with diagnostic logs if startup was unsuccessful.
          if ! docker logs mcp-container-test 2>&1 | grep -q "Application startup complete."; then
            echo "MCP container failed to become ready within 30 seconds."
            docker logs mcp-container-test
            exit 1
          fi
          python - <<'PY'
          import asyncio
          import socket
          from mcp import Client

          async def main():
              for _ in range(30):
                  try:
                      with socket.create_connection(
                          ("127.0.0.1", 18080), timeout=1
                      ):
                          break
                  except OSError:
                      await asyncio.sleep(1)
              else:
                  raise RuntimeError("MCP container did not start")

              async with Client("http://127.0.0.1:18080/mcp") as client:
                  tools = await client.list_tools()

                  assert {tool.name for tool in tools.tools} == {
                      "read_customer_profile",
                      "update_customer_profile",
                  }

                  result = await client.call_tool(
                      "read_customer_profile",
                      {"customer_id": "CUST-1001"},
                  )

                  assert not result.is_error
                  assert result.structured_content["status"] == "success"
                  assert (
                      result.structured_content["profile"]["customer_id"]
                      == "CUST-1001"
                  )

              print("PASS: MCP Docker container integration test")

          asyncio.run(main())
          PY
      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/mcp-server.log 2>/dev/null || true
